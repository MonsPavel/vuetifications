name: Release

# Called by CI only after all checks pass, using the same commit and event context.
on:
  workflow_call:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout checked commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Skip superseded commits
        id: checked-commit
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$CHECKED_SHA" ]; then
            git checkout -B main "$CHECKED_SHA"
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.checked-commit.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        if: steps.checked-commit.outputs.current == 'true'
        run: npm ci

      - name: Build package
        if: steps.checked-commit.outputs.current == 'true'
        run: npm run build

      - name: Release
        if: steps.checked-commit.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
